name: Feature request
description: Suggest an enhancement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem this feature would solve, then the change you want.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
      placeholder: I cannot set a different model per session.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should the product do instead?
      placeholder: Add a per-session model override in the composer menu.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Optional. What else did you consider?
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Sketches, screenshots, or related issues.
