# Release pipeline
#
# Trigger: push a tag `vX.Y.Z` (must match apps/desktop/package.json version).
# The easiest way to cut a release:
#
#   node scripts/release.mjs 0.2.0 --tag   # bump versions + commit + create tag v0.2.0
#   git push origin <branch> v0.2.0        # push → this workflow builds & publishes
#
# Builds installers for every platform defined in the electron-builder config
# (macOS dmg/zip arm64 only, Windows NSIS and portable ZIP x64, Linux
# AppImage/deb/rpm x64 and arm64), each
# with its native pi-desktop-host-core Rust sidecar. The Linux app.asar is also
# exported as a system-Electron repackaging asset, and all outputs — with their
# electron-updater latest*.yml feeds — are published to the GitHub Release
# (D126/D285/D364/D603).
#
# Releases go to the PUBLIC repository mySlyy/releases, not to this (private)
# source repository: users, electron-updater and the remote pi-host bootstrap
# cannot read releases from a private repo (ADR slyy-downstream-branding). The
# publish job therefore authenticates with the SLYY_RELEASES_TOKEN secret, a
# fine-grained PAT with Contents read/write on mySlyy/releases only; the
# default GITHUB_TOKEN cannot write to another repository.
#
# macOS signing on tag pushes follows the SLYY_MAC_SIGNING_ENABLED repository
# variable. Set to 'true', tag artifacts are Developer ID-signed, notarized,
# and stapled before upload (D450 / ADR 0289) and missing Apple secrets fail
# the run. Unset (no Apple secrets exist yet), the macOS lanes package
# unsigned, and the release is published as a GitHub pre-release whose notes
# state that macOS and Windows builds are unsigned.
#
# It also builds the headless `pi-host` bundle for both Linux architectures the
# desktop publishes and publishes each as
# pi-host-<version>-linux-<arch>.tar.gz plus a .sha256 sidecar. The desktop's
# SSH bootstrap downloads that asset at the desktop's version and verifies the
# published checksum before installing on the remote machine (rollout
# 06-delivery/07-remote-control-rollout.md §6 acceptance 4; D375 / ADR 0284).

name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      sign_macos:
        description: 'Sign and notarize macOS artifacts (default true; false packages unsigned macOS artifacts)'
        required: false
        default: true
        type: boolean

# Least privilege by default. No job writes to this repository: the publish job
# writes to mySlyy/releases with SLYY_RELEASES_TOKEN.
permissions:
  contents: read

env:
  # One switch for the build and publish jobs. Tag pushes sign only when the
  # SLYY_MAC_SIGNING_ENABLED repository variable is 'true'; workflow_dispatch
  # follows its sign_macos input (default true).
  MACOS_SIGN_RELEASE: ${{ (github.event_name == 'workflow_dispatch' && inputs.sign_macos) || (github.event_name != 'workflow_dispatch' && vars.SLYY_MAC_SIGNING_ENABLED == 'true') }}
  # Public repository that receives every release (see header).
  RELEASES_REPOSITORY: mySlyy/releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    # Same gate as ci.yml. A tag push does not trigger ci.yml, so without this
    # job a broken tree could be built and published untested.
    name: Verify (build / typecheck / lint / test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require the releases-repository token on tag builds
        # Fail before an hour of platform builds, not in the publish job.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          SLYY_RELEASES_TOKEN: ${{ secrets.SLYY_RELEASES_TOKEN }}
        run: |
          if [ -z "${SLYY_RELEASES_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SLYY_RELEASES_TOKEN (fine-grained PAT, Contents read/write on ${RELEASES_REPOSITORY}). See docs/spec/06-delivery/06-release-runbook.md section 4.5."
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm build:js

      - name: Typecheck Desktop
        run: pnpm --filter @pi-desktop/desktop typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm -r --if-present test

      - name: Rust host-core test
        run: cargo test -p host-core --locked

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            arch: arm64
            runner_arch: arm64
            artifact: mac-arm64
            platform: macos
            dist: dist:mac
          - name: Windows x64
            os: windows-latest
            arch: x64
            artifact: windows-x64
            platform: windows
            dist: dist:win
          - name: Linux x64
            # Ubuntu 22.04 keeps host-core at glibc 2.35 so Ubuntu 22.04,
            # Debian 12, and Fedora 36+ can load the binary. ubuntu-latest
            # (24.04) would raise the floor to 2.39.
            os: ubuntu-22.04
            arch: x64
            runner_arch: x86_64
            artifact: linux-x64
            platform: linux
            feed: latest-linux.yml
            dist: dist:linux
          - name: Linux arm64
            # GitHub's native arm64 runner packages the Electron app and the
            # host-core sidecar at the same architecture; the `-arm` image
            # keeps the glibc 2.35 floor the x64 lane documents
            # (ubuntu-24.04-arm would raise it to 2.39).
            os: ubuntu-22.04-arm
            arch: arm64
            runner_arch: aarch64
            artifact: linux-arm64
            platform: linux
            feed: latest-linux-arm64.yml
            dist: dist:linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Verify native runner architecture
        # A mislabelled or emulated runner would wrap one architecture's
        # Electron app around the other architecture's Rust sidecar. The
        # Windows rows carry no `runner_arch` because electron-builder
        # cross-builds Windows from any runner.
        if: matrix.runner_arch
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.runner_arch }}"
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "::error::Expected $expected_arch runner, got $actual_arch."
            exit 1
          fi

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $APP_VERSION."
            echo "Run 'node scripts/release.mjs $TAG_VERSION --tag' to bump versions before tagging."
            exit 1
          fi

      - name: Validate bundled models.dev catalog
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from 'node:fs/promises';
          const path = 'apps/desktop/resources/models.dev/api.json';
          const catalog = JSON.parse(await readFile(path, 'utf8'));
          const valid = catalog && !Array.isArray(catalog) && typeof catalog === 'object' &&
            Object.values(catalog).some((provider) => provider && typeof provider === 'object' && provider.models);
          if (!valid) throw new Error(`${path} contains no provider model records`);
          console.log(`${path} is valid`);
          NODE

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Match the Node that Electron 43 bundles (24.18), so the released
          # artifacts are built against the runtime the app actually ships.
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Prepare package inputs
        run: |
          set -euo pipefail
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm --filter '@pi-desktop/desktop^...' --fail-if-no-match build

          wait "$host_build_pid"
          trap - EXIT

      - name: Package installers (${{ matrix.dist }})
        if: matrix.platform != 'macos'
        # The dist scripts pass --publish never themselves: electron-builder
        # must not self-publish on tag builds (no token; softprops owns it).
        # The explicit architecture keeps the package and native Rust sidecar
        # aligned with the runner selected by this matrix entry.
        run: pnpm --filter @pi-desktop/desktop run ${{ matrix.dist }} -- --${{ matrix.arch }}

      - name: Package unsigned macOS installer
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE != 'true'
        env:
          # Tag push without SLYY_MAC_SIGNING_ENABLED, or workflow_dispatch
          # with sign_macos=false.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          # Artifact names are defined in apps/desktop/package.json: the mac
          # pattern labels ZIPs, and the dmg target pattern labels DMGs.
          pnpm --filter @pi-desktop/desktop run dist:mac -- --${{ matrix.arch }}

      - name: Diagnose macOS signing environment
        # Records the runner baseline (system, codesign, identities, keychain,
        # Xcode tools, Apple timestamp reachability) before electron-builder
        # imports the certificate. Informational: the Developer ID identity is
        # absent here by design and is imported from CSC_LINK during packaging.
        # Signed lane only: the script needs the Slyy identity name, and an
        # unsigned build has no signing environment to diagnose.
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          MAC_SIGNING_IDENTITY: ${{ vars.SLYY_MAC_SIGNING_IDENTITY }}
        run: scripts/macos-signing-diagnostics.sh

      - name: Require macOS signing and notarization secrets
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${CSC_LINK}" ]] || missing+=(CSC_LINK)
          [[ -n "${CSC_KEY_PASSWORD}" ]] || missing+=(CSC_KEY_PASSWORD)
          [[ -n "${APPLE_ID}" ]] || missing+=(APPLE_ID)
          [[ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]] || missing+=(APPLE_APP_SPECIFIC_PASSWORD)
          [[ -n "${APPLE_TEAM_ID}" ]] || missing+=(APPLE_TEAM_ID)
          if ((${#missing[@]} > 0)); then
            echo "::error::Missing GitHub Actions secrets for macOS signing/notarization: ${missing[*]}"
            echo "::error::Add them under Settings → Secrets and variables → Actions. See docs/spec/06-delivery/06-release-runbook.md."
            exit 1
          fi
          if [[ "${APPLE_TEAM_ID}" != "${{ vars.SLYY_APPLE_TEAM_ID }}" ]]; then
            echo "::error::APPLE_TEAM_ID must match the SLYY_APPLE_TEAM_ID repository variable (frozen Slyy Developer ID team)."
            exit 1
          fi

      - name: Package signed and notarized macOS installer
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # electron-builder rejects the "Developer ID Application:" prefix on
          # identity names and resolves the certificate itself, so CSC_NAME
          # carries the bare common name only.
          CSC_NAME: ${{ vars.SLYY_MAC_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # electron-builder prints one "signing Slyy Gen2.app" line and then
          # goes quiet: @electron/osx-sign walks Contents and codesigns every
          # Mach-O serially, builder-util silently retries a failing pass up to
          # three times, and @electron/notarize zips, uploads, and waits for
          # Apple's queue. These two namespaces expose all three phases without
          # leaking credentials, because both render their own command lines
          # through a password filter. `electron-builder` itself is deliberately
          # absent: builder-util's `executing` debug line prints every spawned
          # command with only its own stem list redacted, and that list does not
          # cover `security set-key-partition-list -k <p12 password>`. The
          # watchdog redacts the secret values and any --password/-k argument on
          # top of that.
          DEBUG: "electron-osx-sign*,electron-notarize*"
          # 30 minutes keeps a stuck signing/notarization phase reported by the
          # watchdog (diagnostics + summary) inside the 60-minute job budget.
          PI_SIGNING_TIMEOUT_SECONDS: "1800"
          PI_SIGNING_STALL_SECONDS: "300"
          PI_STAPLER_MAX_ATTEMPTS: "6"
          PI_STAPLER_RETRY_DELAY_SECONDS: "10"
        run: |
          set -euo pipefail
          # Artifact names are defined in apps/desktop/package.json: the mac
          # pattern labels ZIPs, and the dmg target pattern labels DMGs.
          # The watchdog forwards every line unchanged and keeps the child's
          # exit code; it adds a heartbeat while the phase is silent, dumps the
          # active codesign target and process state when it stalls, reports
          # per-file codesign timings, and fails the step after
          # PI_SIGNING_TIMEOUT_SECONDS instead of waiting for the job timeout.
          node scripts/macos-signing-watchdog.mjs \
            --label "dist:mac-${{ matrix.arch }}" \
            -- pnpm --filter @pi-desktop/desktop run dist:mac -- --${{ matrix.arch }} \
              -c.mac.forceCodeSigning=true \
              -c.mac.notarize=true

      - name: Analyze the packaged macOS app bundle
        # Reports the file / Mach-O / framework / nested-bundle counts that
        # determine how much work the signing phase had, on the exact bundle the
        # release just produced. Diagnosis only: continue-on-error keeps a
        # surprising bundle layout from failing a release.
        if: matrix.platform == 'macos'
        continue-on-error: true
        run: node scripts/macos-bundle-inventory.mjs apps/desktop/release

      - name: Notarize and staple the macOS DMG
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          SLYY_APPLE_TEAM_ID: ${{ vars.SLYY_APPLE_TEAM_ID }}
          # 20 minutes bounds the second Apple wait; the packaging phase owns
          # the first one.
          PI_SIGNING_TIMEOUT_SECONDS: "1200"
          PI_SIGNING_STALL_SECONDS: "300"
        run: |
          set -euo pipefail
          # notarytool submit --wait blocks until Apple answers; the watchdog
          # keeps that wait observable and bounded.
          node scripts/macos-signing-watchdog.mjs \
            --label "notarize-dmg-${{ matrix.arch }}" \
            -- scripts/notarize-and-staple-macos-release-dmg.sh apps/desktop/release

      - name: Verify signed and notarized macOS installer
        if: matrix.platform == 'macos' && env.MACOS_SIGN_RELEASE == 'true'
        env:
          MAC_SIGNING_IDENTITY: ${{ vars.SLYY_MAC_SIGNING_IDENTITY }}
        run: scripts/verify-macos-release.sh apps/desktop/release

      - name: Verify Linux host-core glibc floor
        if: matrix.platform == 'linux'
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: Export Linux ASAR release asset
        if: matrix.platform == 'linux'
        run: node scripts/export-linux-asar.mjs --arch ${{ matrix.arch }}

      - name: Verify the Linux update feed
        # electron-builder names the Linux feed `latest-linux.yml` for x64 and
        # `latest-linux-<arch>.yml` for every other Linux architecture — the
        # same names electron-updater requests on those architectures — so the
        # two lanes cannot overwrite each other's feed when the publish job
        # merges their artifacts.
        if: matrix.platform == 'linux'
        run: |
          set -euo pipefail
          feed="apps/desktop/release/${{ matrix.feed }}"
          if [[ ! -f "$feed" ]]; then
            echo "::error::Expected the Linux updater feed at $feed"
            ls apps/desktop/release || true
            exit 1
          fi

      - name: Verify macOS artifact names
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected_dmg=(apps/desktop/release/Slyy-*-${{ matrix.arch }}.dmg)
          expected_dmg_blockmap=(apps/desktop/release/Slyy-*-${{ matrix.arch }}.dmg.blockmap)
          expected_zip=(apps/desktop/release/Slyy-*-${{ matrix.arch }}-mac.zip)
          expected_zip_blockmap=(apps/desktop/release/Slyy-*-${{ matrix.arch }}-mac.zip.blockmap)
          if [[ "${#expected_dmg[@]}" -ne 1 || "${#expected_dmg_blockmap[@]}" -ne 1 || "${#expected_zip[@]}" -ne 1 || "${#expected_zip_blockmap[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one ${{ matrix.arch }} DMG, DMG blockmap, ZIP, and ZIP blockmap."
            printf '%s\n' apps/desktop/release/* || true
            exit 1
          fi
          for artifact in apps/desktop/release/Slyy-*; do
            case "$artifact" in
              *-${{ matrix.arch }}.dmg|*-${{ matrix.arch }}.dmg.blockmap|*-${{ matrix.arch }}-mac.zip|*-${{ matrix.arch }}-mac.zip.blockmap) ;;
              *)
                echo "::error::Unexpected unlabelled or wrong-architecture macOS artifact: $artifact"
                exit 1
                ;;
            esac
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.artifact }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.asar
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml

  pi-host-bundle:
    name: Bundle pi-host (Linux ${{ matrix.arch }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every Linux platform the desktop release publishes. Keep this list
          # in lockstep with the desktop build matrix above and with
          # PUBLISHED_TARGETS in apps/desktop/electron/main/remote/pi-host-release.ts:
          # a bundle the desktop refuses to install is dead weight, and a target
          # the desktop offers without a bundle fails mid-download.
          - arch: x64
            os: ubuntu-22.04
            runner_arch: x86_64
          - arch: arm64
            os: ubuntu-22.04-arm
            runner_arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Compare tag with apps/desktop/package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match apps/desktop/package.json version $APP_VERSION."
            exit 1
          fi

      - name: Verify native runner architecture
        if: matrix.runner_arch
        run: |
          set -euo pipefail
          actual_arch="$(uname -m)"
          expected_arch="${{ matrix.runner_arch }}"
          if [ "$actual_arch" != "$expected_arch" ]; then
            echo "::error::Expected $expected_arch runner, got $actual_arch."
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build inputs (host-core, workspace, sidecar bundle)
        run: |
          set -euo pipefail
          # Ubuntu 22.04 keeps the host-core glibc floor at 2.35, matching the
          # desktop Linux build so the bundled binary loads on the same distros.
          cargo build --release --locked -p host-core &
          host_build_pid=$!
          trap 'kill "$host_build_pid" 2>/dev/null || true' EXIT

          pnpm install --frozen-lockfile
          pnpm build:js
          pnpm --filter @pi-desktop/agent-runtime bundle
          pnpm --filter @pi-desktop/pi-host build

          wait "$host_build_pid"
          trap - EXIT

      - name: Verify host-core glibc floor
        run: node scripts/check-linux-host-glibc.mjs target/release/pi-desktop-host-core

      - name: Assemble pi-host bundle
        run: node apps/pi-host/scripts/bundle.mjs --platform linux --arch ${{ matrix.arch }}

      - name: Archive bundle with checksum
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./apps/pi-host/package.json').version")"
          name="pi-host-${VERSION}-linux-${{ matrix.arch }}"
          out="apps/pi-host/dist-bundle"
          if [ ! -d "$out/$name" ]; then
            echo "::error::expected bundle directory $out/$name"
            ls -la "$out" || true
            exit 1
          fi
          tar -czf "$out/${name}.tar.gz" -C "$out" "$name"
          ( cd "$out" && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256" )
          cat "$out/${name}.tar.gz.sha256"

      - name: Upload pi-host bundle
        uses: actions/upload-artifact@v7
        with:
          name: pi-host-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            apps/pi-host/dist-bundle/pi-host-*-linux-${{ matrix.arch }}.tar.gz
            apps/pi-host/dist-bundle/pi-host-*-linux-${{ matrix.arch }}.tar.gz.sha256

  publish:
    name: Publish GitHub Release (mySlyy/releases)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, pi-host-bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing is written to this repository; the release is created in
    # RELEASES_REPOSITORY with SLYY_RELEASES_TOKEN.
    permissions:
      contents: read
    steps:
      - name: Require the releases-repository token
        env:
          SLYY_RELEASES_TOKEN: ${{ secrets.SLYY_RELEASES_TOKEN }}
        run: |
          if [ -z "${SLYY_RELEASES_TOKEN}" ]; then
            echo "::error::Missing GitHub Actions secret SLYY_RELEASES_TOKEN (fine-grained PAT, Contents read/write on ${RELEASES_REPOSITORY})."
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Verify macOS updater feed
        # Slyy ships Apple silicon only (ADR slyy-downstream-branding), so
        # electron-builder's single latest-mac.yml is the feed as is. It must
        # point electron-updater at the arm64 ZIP.
        working-directory: dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ ! -f latest-mac.yml ]; then
            echo "::error::Expected the macOS updater feed latest-mac.yml"
            exit 1
          fi
          if ! grep -qx "path: Slyy-${version}-arm64-mac.zip" latest-mac.yml; then
            echo "::error::latest-mac.yml must point at Slyy-${version}-arm64-mac.zip"
            cat latest-mac.yml
            exit 1
          fi

      - name: Verify pi-host bundles for the remote bootstrap
        # apps/desktop/electron/main/remote/pi-host-release.ts downloads
        # https://github.com/<RELEASES_REPOSITORY>/releases/download/v<version>/pi-host-<version>-linux-<arch>.tar.gz
        # plus its .sha256 at the desktop's own version.
        working-directory: dist
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for arch in x64 arm64; do
            for file in "pi-host-${version}-linux-${arch}.tar.gz" "pi-host-${version}-linux-${arch}.tar.gz.sha256"; do
              if [ ! -f "$file" ]; then
                echo "::error::Missing remote bootstrap asset $file"
                exit 1
              fi
            done
          done

      - name: Write release notes
        # Release notes are written here, not generated: GitHub would build
        # them from the commit history of the releases repository, which holds
        # no source. The in-app notes come from packages/shared/src/changelog*.ts.
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            echo "Slyy ${version}"
            echo
            if [ "${MACOS_SIGN_RELEASE}" != "true" ]; then
              echo "> [!WARNING]"
              echo "> **Unsigned pre-release.** The macOS builds are not signed or notarized by Apple:"
              echo "> Gatekeeper blocks the first launch. Allow it once under"
              echo "> System Settings > Privacy & Security > Open Anyway. If macOS reports the app as damaged, run"
              echo "> \`xattr -dr com.apple.quarantine \"/Applications/Slyy Gen2.app\"\`."
              echo "> macOS in-app updates do not work for unsigned builds: install each new version manually from this page."
              echo
            fi
            echo "> [!NOTE]"
            echo "> The Windows builds are unsigned: SmartScreen may warn on first launch (More info > Run anyway)."
            echo
            echo "| Platform | Download |"
            echo "| --- | --- |"
            echo "| macOS Apple silicon | \`Slyy-${version}-arm64.dmg\` |"
            echo "| Windows x64 | \`Slyy-Setup-${version}.exe\` (portable: \`Slyy-Portable-${version}.zip\`) |"
            echo "| Linux x64 / arm64 | AppImage, deb, rpm |"
            echo
            echo "\`pi-host-${version}-linux-<arch>.tar.gz\` (+ \`.sha256\`) is the remote host bundle Slyy installs over SSH."
          } > release-notes.md
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # D126/D285/D364/D603: all desktop platforms and both native macOS
          # architectures ship from tag builds — installers, the Windows
          # portable ZIP, the Linux ASAR, blockmaps, the pi-host bundles, and
          # the latest*.yml feeds that drive electron-updater on each platform
          # (in-app for Windows NSIS and Linux AppImage; macOS and Windows ZIP
          # remain manual-delivery by product policy).
          repository: ${{ env.RELEASES_REPOSITORY }}
          token: ${{ secrets.SLYY_RELEASES_TOKEN }}
          # Same tag name as this repository's tag; GitHub creates it in the
          # releases repository on its default branch (no source is shared).
          tag_name: ${{ github.ref_name }}
          name: Slyy ${{ github.ref_name }}
          body_path: release-notes.md
          files: dist/*
          generate_release_notes: false
          # Version prereleases (x.y.z-beta.N) and every unsigned macOS build
          # are pre-releases, so they never become "latest".
          prerelease: ${{ contains(github.ref_name, '-') || env.MACOS_SIGN_RELEASE != 'true' }}
