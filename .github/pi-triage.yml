# Triage configuration for the `pi` action.
#
# Every new issue is labelled automatically, and linked to an existing issue when
# it looks like the same problem. The run posts no comment unless it finds a
# duplicate.
#
# Two rules cannot be configured away: `labels.type.options` must contain `bug`,
# and `duplicate.label` must name an existing label. Every label listed here must
# already exist on the repository — check with:
#   bun run scripts/check-triage-config.ts --config .github/pi-triage.yml --repo <owner>/<repo>

labels:
  # Exactly one is applied.
  type:
    required: true
    options:
      - { name: bug, description: "Broken feature, error, or crash" }
      - { name: enhancement, description: "New feature or experience improvement" }
      - { name: documentation, description: "Missing or incorrect documentation" }
      - { name: question, description: "Usage question" }
      - { name: performance, description: "Slow, high memory, or abnormal resource use" }
      - { name: security, description: "Security vulnerability or sensitive-data risk" }

  # Exactly one is applied.
  priority:
    required: true
    options:
      - { name: P0, description: "Data loss, crash, security vulnerability, or feature fully unusable" }
      - { name: P1, description: "Core feature impaired, a workaround exists" }
      - { name: P2, description: "Ordinary defect or experience issue, main flow unaffected" }
      - { name: P3, description: "Suggestion, optimization, or edge case" }

  # At most one is applied.
  state:
    required: false
    options:
      - { name: needs-info, description: "Missing reproduction steps, environment, or version" }

duplicate:
  label: duplicate
  confidence: 0.8
  candidates: 8
  include_comments: true
  comment:
    on_new_issue: |
      Possible duplicate of #{{number}} ({{state}}): {{reason}}

      If this is the same problem, please continue the discussion in #{{number}} and close this issue.
    on_original: |
      This problem was reported again: #{{new_number}} ({{date}}).
